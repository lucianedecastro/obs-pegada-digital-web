<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Observatório de Pegada Digital | Auditoria Ambiental</title>
    <meta name="description" content="Plataforma de auditoria de desmaterialização e impacto ambiental. Projeto de Extensão - ADS 2026.">
    <meta name="author" content="Luciane de Castro">
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <meta name="theme-color" content="#00ff88">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <main class="container">
        <header>
            <h1 onclick="resetarCalculo()" style="cursor: pointer;" title="Clique para novo cálculo">
                🌱 Observatório de Pegada Digital
            </h1>
            <p>Auditoria de Desmaterialização e Impacto Ambiental</p>
        </header>

        <section class="card">
            <div class="form-group">
                <label for="material">Selecione o Material Evitado:</label>
                <select id="material">
                    <option value="PVC">PVC - Policloreto de Vinila</option>
                    <option value="LDPE">LDPE - Polietileno</option>
                    <option value="PMMA">PMMA - Acrílico</option>
                </select>
            </div>

            <div class="form-group">
                <label for="peso">Peso do material (kg):</label>
                <input type="number" id="peso" placeholder="Ex: 10.5">
            </div>

            <button id="btn-calcular">Calcular Impacto Evitado</button>
        </section>

        <section id="resultado" class="card result-card hidden">
            <h3>📊 Resultado da Auditoria</h3>
            <div id="dados-resultado"></div>
            <button onclick="gerarRelatorio()" style="background-color: #30363d; margin-top: 15px; font-size: 0.8rem;">
                📥 Baixar Relatório Auditável (PDF)
            </button>
        </section>

        <nav style="margin: 40px 0; text-align: center;">
            <hr style="border: 0; border-top: 1px solid var(--border-glow); opacity: 0.3; margin-bottom: 20px;">
            
            <a href="sobre.html" style="color: var(--neon-green); text-decoration: none; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; padding: 10px 20px;">
                ℹ️ Conheça o Projeto e a Metodologia Científica
            </a>
            
            <hr style="border: 0; border-top: 1px solid var(--border-glow); opacity: 0.3; margin-top: 20px;">
        </nav>

        <footer style="text-align: center; font-size: 0.8rem; color: #888;">
            <p>API Rest desenvolvida para o Projeto de Extensão UNISA 2026</p>
            <p><strong>Aluna:</strong> Luciane de Castro - <strong>RA:</strong> 4556933</p>
            <p>Análise e Desenvolvimento de Sistemas</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
